name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  minimum-go:
    name: Go 1.26 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: |
            go.mod
            adapters/etcdraft/go.mod
            adapters/etcdraft/go.sum

      - name: Test root module
        run: go test ./...

      - name: Vet root module
        run: go vet ./...

      - name: Test etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go test ./...

      - name: Vet etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.mod
            adapters/etcdraft/go.mod
            adapters/etcdraft/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify root module
        timeout-minutes: 10
        run: |
          go mod verify
          go mod tidy -diff

      - name: Verify etcd/raft module
        timeout-minutes: 10
        working-directory: adapters/etcdraft
        run: |
          go mod verify
          go mod tidy -diff

      - name: Test
        run: go test ./...

      - name: Verify portable application vectors independently
        run: python3 tools/verify_apporacle.py --self-test

      - name: Verify synthetic projection study
        run: |
          go run ./cmd/draft-projection-study --verify evaluation/results/projection-v1/result.json
          (cd evaluation/results/projection-v1 && sha256sum -c SHA256SUMS)

      - name: Test etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go test ./...

      - name: Repeat etcd/raft determinism tests
        working-directory: adapters/etcdraft
        run: go test -count=20 ./...

      - name: Verify published cross-adapter corpus
        working-directory: adapters/etcdraft
        run: |
          go run ./cmd/draft-cross verify \
            --plan ../../corpus/cross-adapter/v1/loss-2pct-seed-20260814/semantic.plan.json \
            --source-run ../../corpus/cross-adapter/v1/loss-2pct-seed-20260814/source.run.json \
            --in ../../corpus/cross-adapter/v1/loss-2pct-seed-20260814/cross
          go run ./cmd/draft-cross verify \
            --plan ../../corpus/cross-adapter/v1/portable-faults-v1-seed-1/semantic.plan.json \
            --source-run ../../corpus/cross-adapter/v1/portable-faults-v1-seed-1/source.run.json \
            --in ../../corpus/cross-adapter/v1/portable-faults-v1-seed-1/cross
          (cd ../../corpus/cross-adapter/v1/loss-2pct-seed-20260814 && \
            sha256sum -c SHA256SUMS)
          (cd ../../corpus/cross-adapter/v1/portable-faults-v1-seed-1 && \
            sha256sum -c SHA256SUMS)

      - name: Verify published evaluation artifact
        run: |
          go run ./cmd/draft-eval --verify \
            evaluation/results/v1/steady-cluster-6a685e251794/result.json
          (cd evaluation/results/v1/steady-cluster-6a685e251794 && \
            sha256sum -c SHA256SUMS)

      - name: Vet
        run: go vet ./...

      - name: Vet etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go vet ./...

      - name: Race detector
        run: go test -race ./...

      - name: Race detector for etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go test -race ./...

      - name: Compile benchmarks
        run: go test -run '^$' -bench '^$' ./...
