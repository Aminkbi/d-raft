name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Test
        run: go test ./...

      - name: Verify portable application vectors independently
        run: python3 tools/verify_apporacle.py --self-test

      - name: Test etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go test ./...

      - name: Repeat etcd/raft determinism tests
        working-directory: adapters/etcdraft
        run: go test -count=20 ./...

      - name: Verify published cross-adapter corpus
        working-directory: adapters/etcdraft
        run: |
          go run ./cmd/draft-cross verify \
            --plan ../../corpus/cross-adapter/v1/loss-2pct-seed-20260814/semantic.plan.json \
            --source-run ../../corpus/cross-adapter/v1/loss-2pct-seed-20260814/source.run.json \
            --in ../../corpus/cross-adapter/v1/loss-2pct-seed-20260814/cross
          go run ./cmd/draft-cross verify \
            --plan ../../corpus/cross-adapter/v1/portable-faults-v1-seed-1/semantic.plan.json \
            --source-run ../../corpus/cross-adapter/v1/portable-faults-v1-seed-1/source.run.json \
            --in ../../corpus/cross-adapter/v1/portable-faults-v1-seed-1/cross
          (cd ../../corpus/cross-adapter/v1/loss-2pct-seed-20260814 && \
            sha256sum -c SHA256SUMS)
          (cd ../../corpus/cross-adapter/v1/portable-faults-v1-seed-1 && \
            sha256sum -c SHA256SUMS)

      - name: Vet
        run: go vet ./...

      - name: Vet etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go vet ./...

      - name: Race detector
        run: go test -race ./...

      - name: Race detector for etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go test -race ./...

      - name: Compile benchmarks
        run: go test -run '^$' -bench '^$' ./...
