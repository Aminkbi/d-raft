name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Test
        run: go test ./...

      - name: Test etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go test ./...

      - name: Repeat etcd/raft determinism tests
        working-directory: adapters/etcdraft
        run: go test -count=20 ./...

      - name: Vet
        run: go vet ./...

      - name: Vet etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go vet ./...

      - name: Race detector
        run: go test -race ./...

      - name: Race detector for etcd/raft adapter
        working-directory: adapters/etcdraft
        run: go test -race ./...

      - name: Compile benchmarks
        run: go test -run '^$' -bench '^$' ./...
